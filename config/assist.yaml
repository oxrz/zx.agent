# Q&A assist mode -- captures questions, answers with bilingual (Chinese/English) explanations
# Listens to both the microphone (your questions) and system audio (meeting/video statements).
# Statements are buffered into a rolling context (20 minutes by default), used as background when answering questions.
# Run: python main.py --config config/assist.yaml  (or shorthand -c config/assist.yaml)

mode: "assist"

stt:
  provider: "optimum"         # optimum | pywhispercpp | faster-whisper
  model: "medium"             # tiny | base | small | medium | large-v3 | large-v3-turbo
  device: "auto"              # auto | cpu | gpu
  compute_type: "auto"
  language: "en"              # English recognition only

# Fields identical across all modes (sample_rate/channels/block_duration/
# min_record_duration/streaming_enabled/streaming_interval, ai.provider/model/
# api_key/api_base, logging.level, the whole display block) now live in
# config/common.yaml and are deep-merged in automatically -- only the fields
# that actually differ for assist mode are listed below.
audio:
  silence_threshold: 0.02        # baseline threshold, used for system-output (loopback) detection (multiplied by 0.5 internally, more sensitive)
  mic_silence_threshold: 0.05    # separate mic threshold, raised to filter out ambient noise/breathing false triggers
  silence_duration: 0.6          # English speech is faster-paced, so pause detection is more sensitive
  max_record_duration: 7         # sliding-window cap, keeps per-inference time roughly constant (mirrors the whisper.cpp stream approach)
  input_device: null
  loopback_device: null          # loopback device name (soundcard speaker name), null = auto-use default speaker
  loopback_enabled: true         # enable loopback capture (meeting/video mode)
  mix_mode: "auto"               # auto (mic+system) | mic (mic only) | loopback (system only)

ai:
  max_tokens: 2048
  temperature: 0.7
  # system_prompt is overridden by _ASSIST_SYSTEM_PROMPT in main.py (fixed bilingual output format)

tts:
  enabled: false
  provider: "edge-tts"
  voice: "zh-CN-XiaoxiaoNeural"
  speed: 1.0

# rolling statement context cache (time window, not turn count)
context:
  window_minutes: 20

logging:
  file: "logs/agent-assist.log"
